name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping deploys racing each other.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # No LFS: the only LFS files are game zips in downloads/, which are
          # excluded from the deploy (they exceed Pages' 25 MiB file limit and
          # are served from the downloads.brycebohling.com R2 bucket instead).
          lfs: false

      # Plain static site — no build step. Assemble a dist/ without the
      # oversized downloads/ directory (Pages rejects files over 25 MiB).
      - name: Assemble site
        run: |
          mkdir dist
          rsync -a --exclude downloads --exclude .git --exclude .github --exclude '.DS_Store' ./ dist/

      # The Pages project itself (plus custom domain and DNS) is owned by
      # Terraform in the cf-infra repo — this workflow only deploys builds.
      # --branch=main marks the deployment as production; custom domains
      # serve production deployments only.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=brycebohling --branch=main
